# ─────────────────────────────────────────────────────────────────────
# Validated change pipeline for the Catalyst SD-WAN fabric
#
#   data/fabric.yaml  ─▶  validate  ─▶  plan  ─▶  deploy  ─▶  test  ─▶  notify
#
# One file is edited. Five stages decide whether it reaches a router.
#
#   validate   Is the change coherent?        No fabric, no Vault, no network.
#   plan       What exactly will it do?       The artifact a reviewer reads.
#   deploy     Do it — and prove it.          precheck → apply → postcheck → rollback
#   test       Does it stay done?             A second plan must be empty.
#   notify     Who finds out?                 Slack, on both outcomes.
#
# What runs where:
#
#   ┌──────────────────┬──────────┬──────┬────────┬──────┬────────┐
#   │                  │ validate │ plan │ deploy │ test │ notify │
#   ├──────────────────┼──────────┼──────┼────────┼──────┼────────┤
#   │ feature branch   │    ✅    │  ❌  │   ❌   │  ❌  │   ❌   │
#   │ merge request    │    ✅    │  ✅  │   ❌   │  ❌  │   ❌   │
#   │ default branch   │    ✅    │  ✅  │ ✅ man │  ✅  │   ✅   │
#   └──────────────────┴──────────┴──────┴────────┴──────┴────────┘
#
# The asymmetry is the design. Anyone may propose a change and see it
# checked. Only the default branch may touch the fabric, and only after a
# human presses a button.
# ─────────────────────────────────────────────────────────────────────

stages:
  - validate
  - plan
  - deploy
  - test
  - notify

# Without this, pushing to a branch that has an open MR runs the pipeline
# twice — once for the branch, once for the MR — and both take the same state
# lock. The second one waits for the first for no reason at all.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  # The rollback in 06-pipeline/pipeline.py reads the PREVIOUS commit of the
  # data model (`git show HEAD~1:…`). GitLab clones shallow by default, and a
  # depth of 1 has no HEAD~1 — the rollback would find nothing to roll back
  # to, at the exact moment it matters.
  GIT_DEPTH: "20"

  # ── Vault ─────────────────────────────────────────────────────────
  # Read by the Python toolkit (hvac) and, as a token, by the Terraform vault
  # provider. Addresses, not secrets — the login is the CI/CD variable.
  VAULT_ADDR: "https://vault.autonetops.com"
  VAULT_SDWAN_MOUNT: "workshop"
  VAULT_SDWAN_PATH: "sdwan"

  TERRAFORM_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

  # ── Terraform inputs ──────────────────────────────────────────────
  # Note what is NOT here any more: TF_VAR_student, and any other TF_VAR_*
  # describing the change. Those now come from data/fabric.yaml, rendered to
  # generated.auto.tfvars.json. A value that can arrive from two places is a
  # value nobody can review — and *.auto.tfvars.json beats the environment
  # anyway, so a leftover TF_VAR_ would be silently ignored, which is worse.
  TF_VAR_vault_address: "${VAULT_ADDR}"
  TF_VAR_vault_mount: "${VAULT_SDWAN_MOUNT}"
  TF_VAR_vault_secret_path: "${VAULT_SDWAN_PATH}"

  # Where the pipeline deploys from, and where render.py writes.
  # 05-terraform/ ships module 5's planted errors, so CI uses the solution.
  TF_DIR: "05-terraform/solution"
  DATA_MODEL: "06-pipeline/data/fabric.yaml"

  # ── Terraform state, served by GitLab ─────────────────────────────
  # Module 5 PART C. backend.tf declares `backend "http" {}` and nothing
  # else; every argument arrives here as TF_HTTP_*, which is what makes one
  # config usable from a laptop and from a pipeline at the same time.
  #
  # Why this matters more in CI than anywhere else: `plan`, `deploy` and
  # `test` below are three jobs in three containers. With state as a local
  # file, deploy would start from an empty state on every run and try to
  # create a config group that already exists. Shared state is not a nicety
  # here, it is the thing that makes the pipeline correct.
  TF_STATE_NAME: "sdwan-bootcamp"
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
  # GitLab's state API expects these verbs; they are not the backend's
  # defaults, and getting them wrong produces a 404 at lock time that reads
  # like the state does not exist.
  TF_HTTP_LOCK_METHOD: "POST"
  TF_HTTP_UNLOCK_METHOD: "DELETE"
  TF_HTTP_RETRY_WAIT_MIN: "5"
  TF_HTTP_USERNAME: "gitlab-ci-token"
  TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"

default:
  image: python:3.12-slim
  tags:
    - docker

# ── reusable fragments ──────────────────────────────────────────────

.install_terraform: &install_terraform
  - apt-get update -qq && apt-get install -y -qq curl unzip jq git >/dev/null
  - curl -sSL -o /tmp/tf.zip
    "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
  - unzip -o -q /tmp/tf.zip -d /usr/local/bin
  - terraform version

# Log in to Vault once, up front. Two things come out of it:
#
#   - the Python toolkit reads VAULT_USERNAME / VAULT_PASSWORD directly
#     (sdwan_toolkit.vault does userpass itself, via hvac);
#   - Terraform's vault provider speaks tokens and not userpass, so we
#     exchange the login for a short-lived token here.
#
# Doing it up front means a bad credential fails in five seconds with a clear
# message, instead of thirty lines into a terraform plan.
.vault_login: &vault_login
  - |
    if [ -z "${VAULT_USERNAME:-}" ] || [ -z "${VAULT_PASSWORD:-}" ]; then
      echo "VAULT_USERNAME / VAULT_PASSWORD are not set. Add them as" >&2
      echo "protected CI/CD variables (the password masked as well)." >&2
      exit 1
    fi
    VAULT_TOKEN="$(curl -sS --fail --request POST \
      --data "{\"password\":\"${VAULT_PASSWORD}\"}" \
      "${VAULT_ADDR}/v1/auth/userpass/login/${VAULT_USERNAME}" \
      | jq -r '.auth.client_token')"
    if [ -z "${VAULT_TOKEN}" ] || [ "${VAULT_TOKEN}" = "null" ]; then
      echo "Vault rejected the CI login for ${VAULT_USERNAME}." >&2
      exit 1
    fi
    export VAULT_TOKEN
    echo "Authenticated to ${VAULT_ADDR} as ${VAULT_USERNAME}."

# ─────────────────────────────────────────────────────────────────────
# STAGE 1 — validate
#
# The cheapest stage and the one that saves the most time. Nothing in it
# touches Vault, the Manager or the network, which is exactly the point: the
# gate has to keep working on the day the thing it is gating is down.
# ─────────────────────────────────────────────────────────────────────

data-model-validate:
  stage: validate
  script:
    - pip install -q -e .
    # Schema first (is it the right shape?), then the semantic rules (does it
    # mean something sane?). Exit 1 on either — this is where a change with
    # "CHANGEME" still in the banner stops.
    - python 06-pipeline/validate.py "${DATA_MODEL}"

offline-tests:
  stage: validate
  # No Vault, no fabric, no network. This job must stay that way — it is the
  # one that still works when the lab is down.
  script:
    - pip install -q -e ".[dev]"
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

terraform-fmt:
  stage: validate
  before_script:
    - *install_terraform
  # A real gate, not a formatter that quietly rewrites your files. `-check`
  # fails; `-diff` shows what it wanted. Fix it with `terraform fmt -recursive`
  # locally and commit that, so the diff on the MR is your change and not
  # whitespace.
  script:
    - terraform fmt -check -diff -recursive 05-terraform/

# ─────────────────────────────────────────────────────────────────────
# STAGE 2 — plan
#
# Renders the data model into Terraform's inputs and asks Terraform what it
# would do. Runs on merge requests, because the answer to "what exactly is
# going to change?" belongs in the review, not after it.
# ─────────────────────────────────────────────────────────────────────

plan:
  stage: plan
  needs: ["data-model-validate", "offline-tests", "terraform-fmt"]
  # One state, one lock. This serialises plan and deploy across the whole
  # project: two pipelines planning at once against one fabric is the failure
  # mode remote state exists to prevent.
  resource_group: sdwan
  before_script:
    - *install_terraform
    - *vault_login
    - pip install -q -e .
  script:
    # data/fabric.yaml → 05-terraform/solution/generated.auto.tfvars.json
    - python 06-pipeline/render.py --model "${DATA_MODEL}" --out "${TF_DIR}/generated.auto.tfvars.json"
    - cat "${TF_DIR}/generated.auto.tfvars.json"
    - cd "${TF_DIR}"
    # No -backend-config flags: the TF_HTTP_* variables above already are the
    # backend configuration.
    - terraform init -input=false
    # No -var flags either: *.auto.tfvars.json is loaded automatically, which
    # is what keeps this job and the deploy job from ever disagreeing.
    - terraform plan -input=false -out=tfplan
    # The human-readable plan is the review artifact: it is what a reviewer
    # reads on the MR to answer "what exactly is going to change?".
    - terraform show -no-color tfplan > "${CI_PROJECT_DIR}/tfplan.txt"
    - cat "${CI_PROJECT_DIR}/tfplan.txt"
    # And the binary plan does NOT leave this container. Terraform persists
    # every data source it reads into the plan file, and module 5 PART B has
    # it read the Manager credentials out of Vault — so tfplan is a secret,
    # while `terraform show` redacts it to "(sensitive value)". Job artifacts
    # are downloadable by every Reporter on the project; publish the redacted
    # one, keep the other. It is also why the deploy job re-renders and
    # re-plans instead of receiving this file.
    - rm -f tfplan
  artifacts:
    paths:
      - tfplan.txt
      - 05-terraform/solution/generated.auto.tfvars.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────────────
# STAGE 3 — deploy
#
# The only job that writes to the fabric. Default branch only, manual, behind
# an environment — three independent locks on the same door.
#
# It does not run `terraform apply` directly. It runs the module 6 pipeline,
# which wraps the apply in a snapshot on either side:
#
#   precheck → render → apply → wait → postcheck → compare → rollback?
#
# Exit 0 means the fabric came out the same or better. Exit 1 means it
# regressed AND has already been rolled back.
# ─────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  needs: ["plan"]
  resource_group: sdwan
  environment:
    # No `url:` — the Manager address is in Vault now, and a job-level key
    # cannot read something a script exported.
    name: fabric-lab
  before_script:
    - *install_terraform
    - *vault_login
    - pip install -q -e .
  script:
    # Same backend, same state as the plan job — which is the entire reason
    # the state moved to GitLab.
    - cd "${TF_DIR}" && terraform init -input=false && cd "${CI_PROJECT_DIR}"
    - python 06-pipeline/solution/pipeline.py --model "${DATA_MODEL}"
  after_script:
    # `after_script` runs even when the job fails — which is exactly when the
    # snapshots matter most. They are the evidence that the change was
    # verified, and the material to read when it wasn't.
    - echo "Snapshots kept as artifacts for post-mortem."
  artifacts:
    when: always
    paths:
      - snapshots/
    expire_in: 1 month
  rules:
    # Default branch only, and never automatically. Someone presses the button.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

# ─────────────────────────────────────────────────────────────────────
# STAGE 4 — test
#
# The deploy stage proved the FABRIC is healthy. This stage proves the
# CONFIGURATION is settled: run the plan again and it must come back empty.
#
# A second plan that still wants to change something means one of three
# things, and all three are worth failing a pipeline over:
#
#   • a resource is not idempotent — it rewrites itself on every apply, so
#     every future pipeline shows a change that is not a change;
#   • the Manager normalised a value you sent (trailing whitespace, a case
#     change), so your data model and the fabric disagree, permanently;
#   • somebody is editing the fabric in the GUI while the pipeline runs.
#
# This is the cheapest test in the pipeline and the one people skip.
# ─────────────────────────────────────────────────────────────────────

test-idempotency:
  stage: test
  needs: ["deploy"]
  resource_group: sdwan
  before_script:
    - *install_terraform
    - *vault_login
    - pip install -q -e .
  script:
    - python 06-pipeline/render.py --model "${DATA_MODEL}" --out "${TF_DIR}/generated.auto.tfvars.json"
    - cd "${TF_DIR}"
    - terraform init -input=false
    # -detailed-exitcode is the whole job: 0 = nothing to do, 2 = there is a
    # diff, anything else = the plan itself failed. Those are three different
    # outcomes and a plain `terraform plan` collapses them into one.
    - |
      set +e
      terraform plan -input=false -no-color -detailed-exitcode > "${CI_PROJECT_DIR}/idempotency.txt"
      code=$?
      set -e
      cat "${CI_PROJECT_DIR}/idempotency.txt"
      case "$code" in
        0) echo "✓ Idempotent — the second plan is empty." ;;
        2) echo "✗ DRIFT: the fabric does not match the data model after a successful apply." >&2
           exit 1 ;;
        *) echo "✗ The plan itself failed (exit $code)." >&2
           exit "$code" ;;
      esac
  artifacts:
    when: always
    paths:
      - idempotency.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────────────
# STAGE 5 — notify
#
# A deploy that succeeded and told nobody is fine. A deploy that FAILED and
# told nobody is an outage with a delay fuse on it.
#
# Requires one protected, masked CI/CD variable:
#
#     SLACK_WEBHOOK_URL   an incoming-webhook URL for your channel
#
# ⚠️ NOT SET YET — add it under Settings → CI/CD → Variables. Both jobs are
#    skipped entirely while it is missing, and 06-pipeline/notify.py exits 0
#    if it is called anyway. A pipeline that fails because Slack is down is a
#    pipeline that taught everyone to ignore it.
# ─────────────────────────────────────────────────────────────────────

notify-success:
  stage: notify
  needs: ["test-idempotency"]
  script:
    - python 06-pipeline/notify.py success --text "Fabric verified and idempotent."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SLACK_WEBHOOK_URL
      when: on_success

notify-failure:
  stage: notify
  # No `needs:` on purpose. This job must be able to report a failure in ANY
  # earlier stage, and `needs` would tie it to one of them.
  script:
    - python 06-pipeline/notify.py failure --text "Check the snapshots artifact on the deploy job."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SLACK_WEBHOOK_URL
      when: on_failure

# ─────────────────────────────────────────────────────────────────────
# Where to look when state misbehaves
#
#   Operate → Terraform states      serial number, size, who locked it
#
# A job killed mid-apply leaves the lock held. GitLab shows it, and you
# remove it deliberately — after confirming no apply is still running:
#
#   terraform force-unlock <LOCK_ID>
#
# "Deliberately" is the operative word. A lock you break while someone else
# is applying is two writers on one fabric, which is the failure mode the
# lock existed to prevent.
# ─────────────────────────────────────────────────────────────────────
