# ─────────────────────────────────────────────────────────────────────
# Validated change pipeline for the Catalyst SD-WAN fabric
#
# The module 6 exercise, running for real — on top of module 5's PART B
# (credentials from Vault) and PART C (state in GitLab).
#
# Note the shape: merge requests only get offline tests + `terraform plan`
# (safe, runs on any MR). The apply — with verification and rollback — only
# happens on the default branch, and it is MANUAL. Good automation is not the
# kind that applies fastest. It is the kind that errs toward the safe side.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   VAULT_USERNAME   protected — the CI service account's Vault login
#   VAULT_PASSWORD   masked + protected
#
# That is the whole list. Vault authenticates with userpass (same method the
# students use, different account), and the job exchanges it for a
# short-lived token that Terraform's vault provider can speak.
#
# Nothing else is stored in GitLab. Terraform reads the Manager credentials
# from Vault itself (05-terraform/solution/vault.tf) and the Python toolkit
# does the same through sdwan_toolkit.vault.load_credentials(). State
# authenticates with the job's own CI_JOB_TOKEN, which GitLab mints and
# revokes around each job — there is no state secret to store at all.
#
# One secret to rotate, one secret to revoke.
# ─────────────────────────────────────────────────────────────────────

stages:
  - test
  - plan
  - apply

variables:
  # ── Vault ─────────────────────────────────────────────────────────
  # Read by the Python toolkit (hvac) and, as TF_VAR_*, by the Terraform
  # vault provider. Addresses, not secrets — the token is the CI/CD variable.
  VAULT_ADDR: "https://vault.autonetops.com"
  VAULT_SDWAN_MOUNT: "workshop"
  VAULT_SDWAN_PATH: "sdwan"

  TERRAFORM_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

  # ── Terraform inputs ──────────────────────────────────────────────
  # Terraform reads any variable from TF_VAR_<name>, so a CI/CD variable is
  # all it takes — no -var flags to keep in sync across jobs.
  WS_STUDENT: "00"
  TF_VAR_student: "${WS_STUDENT}"
  TF_VAR_vault_address: "${VAULT_ADDR}"
  TF_VAR_vault_mount: "${VAULT_SDWAN_MOUNT}"
  TF_VAR_vault_secret_path: "${VAULT_SDWAN_PATH}"

  # ── Terraform state, served by GitLab ─────────────────────────────
  # Module 5 PART C. backend.tf declares `backend "http" {}` and nothing
  # else; every argument arrives here as TF_HTTP_*, which is what makes one
  # config usable from a laptop and from a pipeline at the same time.
  #
  # Why this matters more in CI than anywhere else: `plan` and `apply` below
  # are separate jobs in separate containers. With state as a local file the
  # apply job would start from an empty state on every run and try to create
  # a config group that already exists. Shared state is not a nicety here,
  # it is the thing that makes the pipeline correct.
  TF_STATE_NAME: "sdwan-bootcamp"
  TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
  # GitLab's state API expects these verbs; they are not the backend's
  # defaults, and getting them wrong produces a 404 at lock time that reads
  # like the state does not exist.
  TF_HTTP_LOCK_METHOD: "POST"
  TF_HTTP_UNLOCK_METHOD: "DELETE"
  TF_HTTP_RETRY_WAIT_MIN: "5"
  # The job authenticates as itself. CI_JOB_TOKEN is minted when the job
  # starts and revoked when it ends — a credential nobody has to store,
  # rotate, or remember to revoke when someone leaves.
  TF_HTTP_USERNAME: "gitlab-ci-token"
  TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"

default:
  image: python:3.12-slim
  tags:
    - docker

# ── reusable fragments ──────────────────────────────────────────────

.install_terraform: &install_terraform
  - apt-get update -qq && apt-get install -y -qq curl unzip jq >/dev/null
  - curl -sSL -o /tmp/tf.zip
    "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
  - unzip -o -q /tmp/tf.zip -d /usr/local/bin
  - terraform version

# Log in to Vault once, up front. Two things come out of it:
#
#   - the Python toolkit reads VAULT_USERNAME / VAULT_PASSWORD directly
#     (sdwan_toolkit.vault does userpass itself, via hvac);
#   - Terraform's vault provider speaks tokens and not userpass, so we
#     exchange the login for a short-lived token here.
#
# Doing it up front means a bad credential fails in five seconds with a clear
# message, instead of thirty lines into a terraform plan.
.vault_login: &vault_login
  - |
    if [ -z "${VAULT_USERNAME:-}" ] || [ -z "${VAULT_PASSWORD:-}" ]; then
      echo "VAULT_USERNAME / VAULT_PASSWORD are not set. Add them as" >&2
      echo "protected CI/CD variables (the password masked as well)." >&2
      exit 1
    fi
    VAULT_TOKEN="$(curl -sS --fail --request POST \
      --data "{\"password\":\"${VAULT_PASSWORD}\"}" \
      "${VAULT_ADDR}/v1/auth/userpass/login/${VAULT_USERNAME}" \
      | jq -r '.auth.client_token')"
    if [ -z "${VAULT_TOKEN}" ] || [ "${VAULT_TOKEN}" = "null" ]; then
      echo "Vault rejected the CI login for ${VAULT_USERNAME}." >&2
      exit 1
    fi
    export VAULT_TOKEN
    echo "Authenticated to ${VAULT_ADDR} as ${VAULT_USERNAME}."

# ── stage: test ─────────────────────────────────────────────────────

offline-tests:
  stage: test
  # No Vault, no fabric, no network. This job must stay that way — it is the
  # one that still works when the lab is down.
  script:
    - pip install -q -e ".[dev]"
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# ── stage: plan ─────────────────────────────────────────────────────

terraform-plan:
  stage: plan
  needs: ["offline-tests"]
  before_script:
    - *install_terraform
    - *vault_login
  script:
    # The solution dir, not the exercise dir: 05-terraform/main.tf ships with
    # the module 5 deliberate errors (TODO 2.1, TODO 4.1) for students to fix,
    # so CI against it would fail forever by design.
    - cd 05-terraform/solution
    # No -backend-config flags: the TF_HTTP_* variables above already are the
    # backend configuration.
    - terraform init -input=false
    - terraform plan -input=false -out=tfplan
    # The human-readable plan is the review artifact: it is what a reviewer
    # reads on the MR to answer "what exactly is going to change?".
    - terraform show -no-color tfplan > ../../plan.txt
    - cat ../../plan.txt
    # And the binary plan does NOT leave this container. Terraform persists
    # every data source it reads into the plan file, and PART B has it read
    # the Manager credentials out of Vault — so tfplan is a secret, while
    # `terraform show` redacts it to "(sensitive value)". Job artifacts are
    # downloadable by every Reporter on the project; publish the redacted
    # one, keep the other.
    - rm -f tfplan
  artifacts:
    paths:
      - plan.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── stage: apply ────────────────────────────────────────────────────

apply-and-verify:
  stage: apply
  needs: ["terraform-plan"]
  environment:
    # No `url:` — the Manager address is in Vault now, and a job-level key
    # cannot read something a script exported.
    name: fabric-lab
  before_script:
    - *install_terraform
    - *vault_login
    - pip install -q -e .
  script:
    # Same backend, same state as the plan job — which is the entire reason
    # the state moved to GitLab.
    - cd 05-terraform/solution && terraform init -input=false && cd ../..
    # precheck → apply → postcheck → rollback.
    # Exits 1 on regression, having already rolled back. That exit code is
    # what fails this job.
    - python 06-pipeline/solution/pipeline.py
  after_script:
    # `after_script` runs even when the job fails — which is exactly when the
    # snapshots matter most.
    - echo "Snapshots kept as artifacts for post-mortem."
  artifacts:
    when: always
    paths:
      - snapshots/
    expire_in: 1 month
  rules:
    # Default branch only, and never automatically. Someone presses the button.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false

# ─────────────────────────────────────────────────────────────────────
# Where to look when state misbehaves
#
#   Operate → Terraform states      serial number, size, who locked it
#
# A job killed mid-apply leaves the lock held. GitLab shows it, and you
# remove it deliberately — after confirming no apply is still running:
#
#   terraform force-unlock <LOCK_ID>
#
# "Deliberately" is the operative word. A lock you break while someone else
# is applying is two writers on one fabric, which is the failure mode the
# lock existed to prevent.
# ─────────────────────────────────────────────────────────────────────
# Upgrade path: JWT instead of a static token
#
# The static VAULT_TOKEN above is the version that works everywhere. The
# better version has GitLab prove its own identity to Vault, so there is no
# long-lived token to leak or rotate at all — the same trick CI_JOB_TOKEN
# already pulls for the state backend:
#
#   apply-and-verify:
#     id_tokens:
#       VAULT_ID_TOKEN:
#         aud: https://vault.autonetops.com
#     script:
#       - export VAULT_TOKEN="$(curl -sS --request POST \
#           --data "{\"jwt\":\"${VAULT_ID_TOKEN}\",\"role\":\"sdwan-ci\"}" \
#           ${VAULT_ADDR}/v1/auth/jwt/login | jq -r '.auth.client_token')"
#
# It needs the JWT auth backend enabled in Vault with a role bound to this
# project. `id_tokens` is available on all GitLab tiers; the declarative
# `secrets:vault:` keyword is Premium — which is why we do it with curl.
# ─────────────────────────────────────────────────────────────────────
