# ─────────────────────────────────────────────────────────────────────
# MODULE 6, PART A — write the pipeline
#
# A copy of the repository's root .gitlab-ci.yml with six pieces cut out.
# Put them back. GitLab only reads .gitlab-ci.yml at the ROOT, so this file
# does nothing where it sits — break it freely. Check your work with CI Lint
# (<your-project>/-/ci/lint, tick "Simulate a pipeline creation"), or point
# Settings → CI/CD → CI/CD configuration file at 06-pipeline/.gitlab-ci.yml
# and run it for real. The finished version is the root .gitlab-ci.yml.
#
# The table the `rules:` blocks encode:
#
#   ┌──────────────────┬──────────┬──────┬────────┬──────┬────────┐
#   │                  │ validate │ plan │ deploy │ test │ notify │
#   ├──────────────────┼──────────┼──────┼────────┼──────┼────────┤
#   │ feature branch   │    ✅   │  ❌  │   ❌  │  ❌  │   ❌  │
#   │ merge request    │    ✅   │  ✅  │   ❌  │  ❌  │   ❌  │
#   │ default branch   │    ✅   │  ✅  │ ✅ man│  ✅  │   ✅  │
#   └──────────────────┴──────────┴──────┴────────┴──────┴────────┘
#
# Anyone may propose a change and see it checked. Only the default branch
# may touch the fabric, and only when a human presses the button.
# ─────────────────────────────────────────────────────────────────────

# ── TASK 1 ──────────────────────────────────────────────────────────
# Jobs run in the order these stages are declared. The five are correct and
# sorted alphabetically, which is not the order anything should happen in.
# Put them in running order — think about what `test` tests, and whether
# `notify` reports before or after the thing it reports on.
stages:
  - deploy
  - notify
  - plan
  - test
  - validate

# Without this, pushing to a branch with an open MR runs the pipeline twice
# — branch and MR — and both take the same state lock.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# https://docs.gitlab.com/ci/variables/predefined_variables/
variables:
  # The rollback reads HEAD~1 of the data model. GitLab clones shallow by
  # default, and depth 1 has no HEAD~1.
  GIT_DEPTH: "5"

  DATA_MODEL: "06-pipeline/data/fabric.yaml"
  # The solution directory: 06-pipeline/terraform ships PART B's planted
  # TASKs, so CI against it would fail by design. Point this at your own
  # work once PART B passes.
  TF_DIR: "06-pipeline/solution/terraform"

  # Addresses, not secrets — the login is the CI/CD variable.
  TF_VAR_vault_address: "${VAULT_ADDR}"
  TF_VAR_vault_mount: "workshop"
  TF_VAR_vault_secret_path: "sdwan"

  TERRAFORM_VERSION: "1.16.3"
  YQ_VERSION: "v4.44.3"
  TF_IN_AUTOMATION: "true"

  # Note what is NOT here: any TF_VAR_* describing the change. Those live in
  # the data model — a value that can arrive from two places is a value
  # nobody can review.

  # ── Terraform state, served by GitLab (module 5 PART C) ───────────
  # backend.tf declares `backend "http" {}` and nothing else; every argument
  # arrives here as TF_HTTP_*. plan, deploy and test are three containers —
  # with local state, deploy would start empty every run.
  TF_STATE_NAME: "sdwan-pipeline"
  TF_HTTP_ADDRESS: "${TF_STATE_API_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_HTTP_LOCK_ADDRESS: "${TF_STATE_API_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
  TF_HTTP_UNLOCK_ADDRESS: "${TF_STATE_API_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
  # GitLab's state API expects these verbs; the backend's defaults produce a
  # 404 at lock time that reads like the state does not exist.
  TF_HTTP_LOCK_METHOD: "POST"
  TF_HTTP_UNLOCK_METHOD: "DELETE"
  TF_HTTP_RETRY_WAIT_MIN: "5"
  TF_HTTP_USERNAME: "gitlab-ci-token"
  TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"

default:
  image: alpine:3.20
  tags:
    - docker

# ── reusable fragments ──────────────────────────────────────────────

.tools: &tools
  - apk add --no-cache curl jq git bash >/dev/null
  - curl -sSL -o /usr/local/bin/yq
    "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
  - chmod +x /usr/local/bin/yq

.install_terraform: &install_terraform
  - apk add --no-cache curl jq git unzip bash >/dev/null
  - curl -sSL -o /tmp/tf.zip
    "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
  - unzip -o -q /tmp/tf.zip -d /usr/local/bin
  - terraform version

# ─────────────────────────────────────────────────────────────────────
# STAGE 1 — validate
#
# Nothing here touches Vault, the Manager or the network. A gate that needs
# the thing it is gating is not a gate.
# ─────────────────────────────────────────────────────────────────────

data-model-validate:
  stage: validate
  before_script:
    - *tools
  # The MEANING of the change: placeholders, naming, empty targets. The
  # SHAPE is terraform-validate's job, below.
  #
  # ── TASK 2 ────────────────────────────────────────────────────────
  # Run 06-pipeline/validate-data-model.sh against the data model. One line,
  # two things to get right:
  #
  #   • the path is relative to the repository root ($CI_PROJECT_DIR), not
  #     to this file;
  #   • pass "${DATA_MODEL}" rather than hardcoding the path.
  #
  # The script exits 1 when a rule fails, which is all a CI job needs — as
  # long as you do not swallow it with a trailing `|| true`.
  script:
    - echo "TASK 2 — run the data model validator here"

terraform-validate:
  stage: validate
  before_script:
    - *install_terraform
  script:
    # A gate, not a formatter that rewrites your files. Fix it locally with
    # `terraform fmt -recursive` so the MR diff is your change, not whitespace.
    - terraform fmt -check -diff -recursive 06-pipeline/
    # `-backend=false`: no state, no credentials. Still decodes
    # data/fabric.yaml and type-checks every expression that reads it.
    - terraform -chdir="${TF_DIR}" init -backend=false -input=false
    - terraform -chdir="${TF_DIR}" validate

offline-tests:
  stage: validate
  image: python:3.12-slim
  # The toolkit from modules 1–4. No Vault, no fabric, no network — keep it
  # that way; this is the job that still works when the lab is down.
  script:
    - pip install -q -e ".[dev]"
    - python -m pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# ─────────────────────────────────────────────────────────────────────
# STAGE 2 — plan
#
# What exactly will it do? The answer belongs in the review, not after it.
# The preconditions in terraform/main.tf are evaluated HERE: data.sdwan_device
# .before has no depends_on, so a change targeting an unreachable device is
# refused on the merge request, before anyone presses deploy.
# ─────────────────────────────────────────────────────────────────────

plan:
  stage: plan
  needs: ["data-model-validate", "terraform-validate", "offline-tests"]
  # One state, one lock — two pipelines planning at once against one fabric
  # is the failure mode remote state exists to prevent.
  resource_group: sdwan
  before_script:
    - *install_terraform
  script:
    # No -backend-config flags: the TF_HTTP_* variables are the backend config.
    - terraform -chdir="${TF_DIR}" init -input=false
    - terraform -chdir="${TF_DIR}" plan -input=false -out=tfplan
    - terraform -chdir="${TF_DIR}" show -no-color tfplan > tfplan.txt
    - cat tfplan.txt
    # The binary plan does NOT leave this container: Terraform persists every
    # data source it reads into it, including the Vault credentials, while
    # `terraform show` redacts them. Artifacts are downloadable by every
    # Reporter — publish the redacted one. It is also why deploy re-plans.
    - rm -f "${TF_DIR}/tfplan"
  # ── TASK 3 ────────────────────────────────────────────────────────
  # Two blocks missing: `artifacts:` and `rules:`.
  #
  # a) artifacts — publish tfplan.txt, keep it a week. Without it the plan
  #    lives in a job log that scrolls and the reviewer has nothing to open.
  #
  #        artifacts:
  #          paths:
  #            - <the file>
  #          expire_in: <how long>
  #
  # b) rules — merge requests AND the default branch, nowhere else. Two
  #    predefined variables do it; look them up rather than guessing. A
  #    `rules:` list is OR — the job runs if any entry matches.
  #
  #    Not the default branch only: a plan the reviewer cannot see before
  #    merging has stopped being a review. Not every feature branch either
  #    — watch `resource_group` serialise twenty students behind one lock.

# ─────────────────────────────────────────────────────────────────────
# STAGE 3 — deploy
#
# The only job that writes to the fabric. The verification is not here: it
# is the postcondition in terraform/verify.tf, which fails `terraform apply`
# itself. What IS here is the one thing Terraform cannot do — decide what to
# do about a failure.
# ─────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  needs: ["plan"]
  resource_group: sdwan
  environment:
    # No `url:` — the Manager address is in Vault, and a job-level key cannot
    # read something a script exported.
    name: fabric-lab
  before_script:
    - *install_terraform
  script:
    # Same backend, same state as plan — the entire reason state moved to GitLab.
    - terraform -chdir="${TF_DIR}" init -input=false
    - |
      set +e
      terraform -chdir="${TF_DIR}" apply -auto-approve -input=false
      code=$?
      set -e

      if [ "$code" -eq 0 ]; then
        echo "✓ Applied, and the postcondition in verify.tf agreed. Change kept."
        exit 0
      fi

      echo ""
      echo "── ROLLBACK ──"

      # The rollback target is not a backup somebody remembered to take. It
      # is the previous commit of the data model.
      if ! git cat-file -e "HEAD~1:${DATA_MODEL}" 2>/dev/null; then
        echo "✗ No previous version of ${DATA_MODEL} in git." >&2
        echo "  Nothing to roll back to. MANUAL INTERVENTION REQUIRED." >&2
        exit 1
      fi

      # The case that looks like success and isn't: if the data model did not
      # change in this commit, the failure came from somewhere else and
      # re-applying it is a no-op.
      if git diff --quiet HEAD~1 HEAD -- "${DATA_MODEL}"; then
        echo "✗ ${DATA_MODEL} is unchanged in this commit." >&2
        echo "  Nothing here to undo. ESCALATE — do not retry." >&2
        exit 1
      fi

      echo "Reverting the data model to HEAD~1:"
      git --no-pager diff HEAD HEAD~1 -- "${DATA_MODEL}"
      git checkout HEAD~1 -- "${DATA_MODEL}"

      # Chosen over `terraform destroy`: a rollback that causes more impact
      # than the original problem is not a rollback, it is a second incident.
      if terraform -chdir="${TF_DIR}" apply -auto-approve -input=false; then
        echo "✓ Rolled back to the previous data model."
      else
        # The fabric is now in neither the old state nor the new one.
        echo "✗ ROLLBACK FAILED — MANUAL INTERVENTION REQUIRED." >&2
      fi
      exit 1
  after_script:
    # Runs even when the job fails — which is when this matters.
    - terraform -chdir="${TF_DIR}" output -json > outputs.json 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - outputs.json
    expire_in: 1 month
  # ── TASK 4 ────────────────────────────────────────────────────────
  # This job has no `rules:`, so it runs on every push, on every branch,
  # automatically. Write the rule that makes it default branch only and
  # never by itself — four lines:
  #
  #   • the branch variable from TASK 3;
  #   • `when: manual` — the job appears and WAITS;
  #   • `allow_failure: false` — redundant here, and write it anyway.
  #
  #     GitLab gives the same two words two defaults:
  #       when: manual  as a job keyword  →  allow_failure: true
  #       when: manual  inside rules:     →  allow_failure: false
  #
  #     `true` means the pipeline goes green whether or not anyone ran the
  #     job — success reported for a deploy that never happened. We are in
  #     the `rules:` form, but a refactor that lifts `when: manual` out of
  #     it would flip that silently.
  #
  # With `environment: fabric-lab` above, which can require an approval,
  # that is three independent locks on one door: branch, button, approval.

# ─────────────────────────────────────────────────────────────────────
# STAGE 4 — test
#
# Deploy proved the FABRIC survived. This proves the CONFIGURATION is
# settled: the second plan must come back empty. A plan that still wants to
# change something means a non-idempotent resource, a value the Manager
# normalised, or somebody editing the fabric in the GUI — all three worth
# failing a pipeline over.
# ─────────────────────────────────────────────────────────────────────

test-idempotency:
  stage: test
  needs: ["deploy"]
  resource_group: sdwan
  before_script:
    - *install_terraform
  # ── TASK 5 ────────────────────────────────────────────────────────
  # Re-plan and turn the exit code into a verdict. `-detailed-exitcode` is
  # the whole job:
  #
  #     0  nothing to do          → pass
  #     2  there is a diff        → fail: drift after a successful apply
  #     *  the plan itself failed → fail, and keep the exit code
  #
  # A plain `terraform plan` collapses those three into one, which is why
  # nobody notices when it matters. Write the block so that:
  #
  #   • the plan writes to idempotency.txt (the artifact below) and the log;
  #   • a non-zero exit does not kill the job before you can read it —
  #     `set +e` around the command, capture `$?`, `set -e` after;
  #   • each of the three outcomes gets its own message.
  script:
    - terraform -chdir="${TF_DIR}" init -input=false
    - echo "TASK 5 — re-plan with -detailed-exitcode and judge the exit code"
  artifacts:
    when: always
    paths:
      - idempotency.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────────────
# STAGE 5 — notify
#
# A deploy that succeeded and told nobody is fine. A deploy that FAILED and
# told nobody is an outage with a delay fuse on it.
#
# Needs one protected, masked CI/CD variable: SLACK_WEBHOOK_URL.
# ⚠️ NOT SET YET — until it is, both jobs are skipped entirely. A pipeline
#    that fails because Slack is down teaches everyone to ignore it.
#
# The message is built with `jq -n --arg`, not a shell heredoc: a commit
# title containing a quote would break the latter.
# ─────────────────────────────────────────────────────────────────────

.slack: &slack
  - apk add --no-cache curl jq >/dev/null
  - |
    jq -n \
      --arg icon "$ICON" \
      --arg headline "$HEADLINE" \
      --arg project "$CI_PROJECT_PATH" \
      --arg branch "$CI_COMMIT_REF_NAME" \
      --arg sha "$CI_COMMIT_SHORT_SHA" \
      --arg title "$CI_COMMIT_TITLE" \
      --arg author "$GITLAB_USER_LOGIN" \
      --arg url "$CI_PIPELINE_URL" \
      '{text: "\($icon) *\($headline)*\n`\($project)` · `\($branch)` · `\($sha)`\n\($title) — \($author)\n<\($url)|Open the pipeline>"}' \
    | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"

# ── TASK 6 ──────────────────────────────────────────────────────────
# Both jobs are missing their `rules:`. Each runs on the default branch,
# only when $SLACK_WEBHOOK_URL exists, and each on a different outcome:
#
#     when: on_success   /   when: on_failure
#
# Rules stop at the first match, so a single entry per job is enough:
#
#     rules:
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SLACK_WEBHOOK_URL
#         when: <which outcome>
#
# And notice what notify-failure does NOT have: `needs:`. Adding one ties
# it to specific upstream jobs, so it would stay silent when `validate` is
# what failed — and a change stopped at the gate is exactly the one somebody
# is waiting on.

notify-success:
  stage: notify
  needs: ["test-idempotency"]
  variables:
    ICON: "✅"
    HEADLINE: "SD-WAN fabric change deployed, verified and idempotent"
  script:
    - *slack

notify-failure:
  stage: notify
  variables:
    ICON: "🚨"
    HEADLINE: "SD-WAN fabric pipeline FAILED"
  script:
    - *slack

# ─────────────────────────────────────────────────────────────────────
# When state misbehaves: Operate → Terraform states shows the serial, the
# size and who holds the lock. A job killed mid-apply leaves it held:
#
#   terraform -chdir=06-pipeline/solution/terraform force-unlock <LOCK_ID>
#
# Deliberately — a lock you break while someone else is applying is two
# writers on one fabric, which is what the lock was for.
# ─────────────────────────────────────────────────────────────────────
