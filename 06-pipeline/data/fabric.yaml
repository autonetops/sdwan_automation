# ─────────────────────────────────────────────────────────────────────
# The data model — the one file you edit to change the fabric.
#
# Not main.tf. Not terraform.tfvars. Not the GUI. This file, on a branch,
# in a merge request, where somebody else can read the diff and disagree
# with you before it reaches a router.
#
#     data/fabric.yaml  ──yamldecode()──▶  terraform  ──▶  the fabric
#
# There is no renderer and no generated file. Terraform reads this YAML
# itself, in terraform/data_model.tf. Everything the pipeline does
# downstream is a consequence of what is here.
# ─────────────────────────────────────────────────────────────────────

sdwan:
  # Your bootcamp number. Everything you create is prefixed ws<NN>- so the
  student: "00"

  system:
    banner:
      motd: "Managed by the AutoNetOps pipeline - changes go through a merge request"

      # ⚠️ This line fails `validate` on purpose. Run it and read what it
      #    says before you fix it — watching the gate refuse your change is
      #    the first exercise of the module.
      login: "CHANGEME - authorized access only"

  config_group:
    # The bare name. Terraform adds the ws<NN>- prefix; writing it here too
    # gets you ws00-ws00-pipeline, which is valid, deployable and wrong.
    # `validate` catches that as well.
    #
    # Note it is not "config-group": module 5 already creates
    # ws<NN>-config-group on the same Manager, and two Terraform states that
    # both believe they own one object is a fight nobody wins.
    name: pipeline
    description: "Config group deployed by the module 6 pipeline"

  # Which devices this change is aimed at.
  #
  # This key produces no resource at all. terraform/verify.tf reads it to
  # tell "some device in the shared lab is down" (not your problem) apart
  # from "the device you are about to change is down" (very much your
  # problem) — the precondition that refuses to start, and the postcondition
  # that fails the apply.
  #
  # Put your lab's real edge hostnames here, exactly as the Manager reports
  # them. `terraform output` after a successful run lists what it saw.
  targets:
    edges:
      - Site1-Edge1
