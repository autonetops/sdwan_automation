# ─────────────────────────────────────────────────────────────────────
# The data model — the one file you edit to change the fabric.
#
# Not main.tf. Not terraform.tfvars. Not the GUI. This file, on a branch,
# in a merge request, where somebody else can read the diff and disagree
# with you before it reaches a router.
#
#     data/fabric.yaml  ──render──▶  *.auto.tfvars.json  ──▶  terraform
#
# Everything the pipeline does downstream is a consequence of what is here.
# ─────────────────────────────────────────────────────────────────────

sdwan:
  # Your bootcamp number. Everything you create is prefixed ws<NN>- so the
  # class does not overwrite itself.
  #
  # Note that this is NOT read from WS_STUDENT. The data model is the source
  # of truth, and a value that can also arrive from the environment is a
  # value nobody can review. One source, or none.
  student: "00"

  system:
    banner:
      motd: "Managed by the AutoNetOps pipeline - changes go through a merge request"

      # ⚠️ This line fails `validate` on purpose. Run it and read what it
      #    says before you fix it — watching the gate refuse your change is
      #    the first exercise of the module.
      login: "CHANGEME - authorized access only"

  config_group:
    # The bare name. The renderer adds the ws<NN>- prefix; writing it here
    # too gets you ws00-ws00-config-group, which is valid, deployable and
    # wrong. `validate` catches that as well.
    name: config-group
    description: "Config group deployed by the module 6 pipeline"

  # Which devices this change is aimed at.
  #
  # Terraform never sees this key — the Python pipeline does. `precheck()`
  # uses it to tell "some device in the shared lab is down" (not your
  # problem) apart from "the device you are about to change is down" (very
  # much your problem).
  #
  # Put your lab's real edge hostnames here. Module 3's inventory lists them:
  #     python -c "from sdwan_toolkit import SDWANClient, get_edges; \
  #                c=SDWANClient.from_vault(); print([d.hostname for d in get_edges(c)])"
  targets:
    edges:
      - Site1-Edge1
