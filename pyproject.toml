[project]
name = "sdwan-automation"
version = "1.0.0"
description = "Cisco Catalyst SD-WAN automation bootcamp — AutoNetOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "hvac>=2.1",
    "rich>=13.7",
    "httpx>=0.27",
    "ipython>=8.18",
    "ipdb>=0.13",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.optional-dependencies]
nornir = [
    "nornir==3.5.0",
    "nornir-netmiko==1.0.1",
    "nornir-napalm==0.5.0",
    "nornir-scrapli==2025.1.30",
    "nornir-jinja2==0.2.0",
    "nornir-utils==0.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdwan_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
