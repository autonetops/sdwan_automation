[project]
name = "sdwan-automation"
version = "1.0.0"
description = "Cisco Catalyst SD-WAN automation bootcamp — AutoNetOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "hvac>=2.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdwan_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
