name: Fabric change validation

# The module 5 pipeline, running for real on GitHub.
# The GitLab equivalent lives in .gitlab-ci.yml — the repo carries both so it
# works whichever forge you import it into.

on:
  pull_request:
    paths: ["04-terraform/**", "sdwan_toolkit/**", "05-pipeline/**"]
  push:
    branches: [main]
  workflow_dispatch:

env:
  VAULT_ADDR: https://vault.autonetops.com
  WS_STUDENT: "00"

jobs:
  offline-tests:
    name: Offline tests (no fabric involved)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: offline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # Credentials never enter the repository or the logs. The only secret in
      # GitHub is the Vault token; everything else comes from Vault.
      - name: Read credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/sdwan/manager url      | TF_VAR_vmanage_url ;
            secret/data/sdwan/manager username | TF_VAR_vmanage_username ;
            secret/data/sdwan/manager password | TF_VAR_vmanage_password

      - run: terraform init -input=false
        working-directory: 04-terraform
      - run: terraform plan -input=false -var "student=$WS_STUDENT"
        working-directory: 04-terraform

  apply-and-verify:
    name: Apply with verification and rollback
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: fabric-lab # requires approval before touching the fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
      - run: pip install -e .

      - name: Read credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/sdwan/manager url      | VMANAGE_URL ;
            secret/data/sdwan/manager username | VMANAGE_USERNAME ;
            secret/data/sdwan/manager password | VMANAGE_PASSWORD

      - name: Mirror credentials for Terraform
        run: |
          echo "TF_VAR_vmanage_url=$VMANAGE_URL"           >> "$GITHUB_ENV"
          echo "TF_VAR_vmanage_username=$VMANAGE_USERNAME" >> "$GITHUB_ENV"
          echo "TF_VAR_vmanage_password=$VMANAGE_PASSWORD" >> "$GITHUB_ENV"
          echo "TF_VAR_student=$WS_STUDENT"                >> "$GITHUB_ENV"

      - run: terraform init -input=false
        working-directory: 04-terraform

      # The pipeline exits 1 on regression — having already rolled back.
      - name: Precheck → apply → postcheck → rollback
        run: python 05-pipeline/solution/pipeline.py

      # Snapshots stay attached to the run: evidence that the change was
      # verified, and the material to analyse when it wasn't.
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-snapshots
          path: 05-pipeline/snapshots/
