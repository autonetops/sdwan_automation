name: Fabric change validation

# The module 6 pipeline, running for real on GitHub. The GitLab equivalent
# lives in .gitlab-ci.yml — the repo carries both so it works on whichever
# forge you import it into, and the five stages are deliberately the same:
#
#   validate → plan → deploy → test → notify
#
#                     validate │ plan │ deploy │ test │ notify
#   feature branch        ✅   │  ❌  │   ❌   │  ❌  │   ❌
#   pull request          ✅   │  ✅  │   ❌   │  ❌  │   ❌
#   main                  ✅   │  ✅  │ ✅ env │  ✅  │   ✅
#
# No application code anywhere in it: Terraform reads the data model itself,
# and Terraform's preconditions and postconditions are what let the fabric
# refuse its own change.

on:
  pull_request:
    paths:
      - "05-terraform/**"
      - "06-pipeline/**"
      - "sdwan_toolkit/**"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

env:
  VAULT_ADDR: https://vault.autonetops.com
  # Addresses, not secrets. Required repository secrets: VAULT_USERNAME and
  # VAULT_PASSWORD — that is the whole list, plus SLACK_WEBHOOK_URL if you
  # want the notify stage.
  TF_VAR_vault_mount: workshop
  TF_VAR_vault_secret_path: sdwan

  DATA_MODEL: 06-pipeline/data/fabric.yaml
  # The solution directory: 06-pipeline/terraform ships the planted TASKs.
  TF_DIR: 06-pipeline/solution/terraform

  # vault-action fetches the secret before Terraform runs, so the
  # TF_VAR_vmanage_* path is the honest choice here. This is the case that
  # fallback exists for — an environment that solved the problem already.
  TF_VAR_credentials_from_vault: "false"

jobs:
  # ── STAGE 1 — validate ────────────────────────────────────────────
  # No Vault, no fabric, no network beyond the tools. The gate has to keep
  # working on the day the thing it is gating is down.

  validate:
    name: Validate (data model, terraform, offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The MEANING of the change: placeholders, naming, empty targets.
      # yq is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: Data model rules
        run: ./06-pipeline/validate-data-model.sh "$DATA_MODEL"

      # A real gate, not a formatter that rewrites your files behind you.
      - name: Terraform fmt
        run: |
          terraform fmt -check -diff -recursive 05-terraform/
          terraform fmt -check -diff -recursive 06-pipeline/

      # The SHAPE of the change. -backend=false means no state, no
      # credentials — and it still decodes data/fabric.yaml and type-checks
      # every expression that reads it.
      - name: Terraform validate
        run: |
          terraform -chdir="$TF_DIR" init -backend=false -input=false
          terraform -chdir="$TF_DIR" validate

      # The toolkit from modules 1 to 4. Module 6 has no code to test.
      - name: Offline tests
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

  # ── STAGE 2 — plan ────────────────────────────────────────────────

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # Credentials never enter the repository or the logs. The only secrets
      # in GitHub are the Vault login; everything else comes from Vault.
      - name: Read credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: userpass
          username: ${{ secrets.VAULT_USERNAME }}
          password: ${{ secrets.VAULT_PASSWORD }}
          secrets: |
            workshop/data/sdwan url      | TF_VAR_vmanage_url ;
            workshop/data/sdwan username | TF_VAR_vmanage_username ;
            workshop/data/sdwan password | TF_VAR_vmanage_password

      # backend.tf points at GitLab-managed state, which this runner has no
      # credentials for. Deleting that one file falls back to a local state
      # file — fine for a plan, and the reason the GitLab pipeline is the
      # supported one: state that lives for the length of a container is
      # state nobody can review or lock.
      - run: rm -f "$TF_DIR/backend.tf"

      - run: terraform -chdir="$TF_DIR" init -input=false
      - run: terraform -chdir="$TF_DIR" plan -input=false

  # ── STAGE 3 — deploy ──────────────────────────────────────────────
  # The only job that writes to the fabric: main only, behind an environment
  # that requires approval.
  #
  # The verification is not here. It is a postcondition in
  # 06-pipeline/terraform/verify.tf, on a data source that reads the fabric
  # AFTER the change — if a target edge went unreachable, `terraform apply`
  # fails on its own. What IS here is the one thing Terraform cannot do:
  # decide what to do about a failure.

  deploy:
    name: Deploy with verification and rollback
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: fabric-lab
    steps:
      - uses: actions/checkout@v4
        with:
          # The rollback reads the PREVIOUS commit of the data model.
          # actions/checkout defaults to a depth of 1, which has no HEAD~1 —
          # the rollback would find nothing to roll back to, at the exact
          # moment it matters.
          fetch-depth: 20
      - uses: hashicorp/setup-terraform@v3

      - name: Read credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: userpass
          username: ${{ secrets.VAULT_USERNAME }}
          password: ${{ secrets.VAULT_PASSWORD }}
          secrets: |
            workshop/data/sdwan url      | TF_VAR_vmanage_url ;
            workshop/data/sdwan username | TF_VAR_vmanage_username ;
            workshop/data/sdwan password | TF_VAR_vmanage_password

      - run: rm -f "$TF_DIR/backend.tf"
      - run: terraform -chdir="$TF_DIR" init -input=false

      - name: Apply, and roll back on failure
        run: |
          set +e
          terraform -chdir="$TF_DIR" apply -auto-approve -input=false
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "✓ Applied, and the postcondition in verify.tf agreed. Change kept."
            exit 0
          fi

          echo ""
          echo "── ROLLBACK ──"

          if ! git cat-file -e "HEAD~1:${DATA_MODEL}" 2>/dev/null; then
            echo "✗ No previous version of ${DATA_MODEL} in git." >&2
            echo "  Nothing to roll back to. MANUAL INTERVENTION REQUIRED." >&2
            exit 1
          fi

          # The case that looks like success and isn't: if the data model did
          # not change in this commit, the failure did not come from this
          # file. Re-applying it is a no-op, and reporting "rolled back"
          # would be a lie.
          if git diff --quiet HEAD~1 HEAD -- "${DATA_MODEL}"; then
            echo "✗ ${DATA_MODEL} is unchanged in this commit." >&2
            echo "  The failure did not come from the data model, so there is" >&2
            echo "  nothing here to undo. ESCALATE — do not retry." >&2
            exit 1
          fi

          echo "Reverting the data model to HEAD~1:"
          git --no-pager diff HEAD HEAD~1 -- "${DATA_MODEL}"
          git checkout HEAD~1 -- "${DATA_MODEL}"

          if terraform -chdir="$TF_DIR" apply -auto-approve -input=false; then
            echo "✓ Rolled back to the previous data model."
          else
            echo "✗ ROLLBACK FAILED — MANUAL INTERVENTION REQUIRED." >&2
          fi
          exit 1

      - name: Keep the outputs
        if: always()
        run: terraform -chdir="$TF_DIR" output -json > outputs.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-outputs
          path: outputs.json

  # ── STAGE 4 — test ────────────────────────────────────────────────
  # Deploy proved the FABRIC survived. This proves the CONFIGURATION is
  # settled: the second plan must come back empty.

  test-idempotency:
    name: Idempotency
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Read credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: userpass
          username: ${{ secrets.VAULT_USERNAME }}
          password: ${{ secrets.VAULT_PASSWORD }}
          secrets: |
            workshop/data/sdwan url      | TF_VAR_vmanage_url ;
            workshop/data/sdwan username | TF_VAR_vmanage_username ;
            workshop/data/sdwan password | TF_VAR_vmanage_password

      - run: rm -f "$TF_DIR/backend.tf"
      - run: terraform -chdir="$TF_DIR" init -input=false

      # -detailed-exitcode is the whole job: 0 = nothing to do, 2 = there is
      # a diff, anything else = the plan itself failed. Three outcomes that a
      # plain `terraform plan` collapses into one.
      #
      # ⚠️ Local state on this runner means this job re-creates rather than
      #    reads the state, so the check is only honest on GitLab. It is here
      #    so the two pipelines have the same shape — see the README.
      - name: Second plan must be empty
        run: |
          set +e
          terraform -chdir="$TF_DIR" plan -input=false -no-color -detailed-exitcode
          code=$?
          set -e
          case "$code" in
            0) echo "✓ Idempotent — the second plan is empty." ;;
            2) echo "✗ DRIFT: the fabric does not match the data model." >&2; exit 1 ;;
            *) echo "✗ The plan itself failed (exit $code)." >&2; exit "$code" ;;
          esac

  # ── STAGE 5 — notify ──────────────────────────────────────────────
  # A deploy that succeeded and told nobody is fine. A deploy that FAILED
  # and told nobody is an outage with a delay fuse on it.
  #
  # Requires the repository secret SLACK_WEBHOOK_URL — ⚠️ NOT SET YET. The
  # job is skipped while it is missing: a pipeline that fails because Slack
  # is down is a pipeline that teaches everyone to ignore it.

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, test-idempotency]
    if: always() && github.ref == 'refs/heads/main'
    env:
      # The `secrets` context is NOT available in an `if:` condition —
      # neither on a job nor on a step. Lifting the secret into `env` here is
      # the documented way to make "only run this when the secret exists"
      # expressible at all, because `env` IS available in `if:`.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      # jq -n --arg, not string-pasting: a commit title containing a quote
      # would break a hand-built JSON body on the day you least want to
      # debug your notifier.
      - name: Post to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          OK: ${{ needs.deploy.result == 'success' && needs.test-idempotency.result == 'success' }}
        run: |
          if [ "$OK" = "true" ]; then
            ICON="✅"; HEADLINE="SD-WAN fabric change deployed, verified and idempotent"
          else
            ICON="🚨"; HEADLINE="SD-WAN fabric pipeline FAILED"
          fi
          jq -n \
            --arg icon "$ICON" \
            --arg headline "$HEADLINE" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "${GITHUB_SHA:0:8}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: "\($icon) *\($headline)*\n`\($repo)` · `\($ref)` · `\($sha)`\nby \($actor)\n<\($url)|Open the run>"}' \
          | curl -sS -X POST -H 'Content-Type: application/json' -d @- \
              "$SLACK_WEBHOOK_URL"
