name: Validação de mudança no fabric

# O pipeline do módulo 5, rodando de verdade.
#
# Repare no desenho: o PR só recebe `plan` + testes offline (seguro, roda em
# qualquer PR). O `apply` com verificação e rollback só acontece no push para
# main, com approval de ambiente. Automação boa não é a que aplica mais rápido
# — é a que erra em direção ao lado seguro.

on:
  pull_request:
    paths: ["04-terraform/**", "sdwan_toolkit/**", "05-pipeline/**"]
  push:
    branches: [main]
  workflow_dispatch:

env:
  VAULT_ADDR: https://vault.autonetops.com

jobs:
  testes-offline:
    name: Testes offline (sem tocar no fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Rodar a suíte
        run: python -m pytest -q

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: testes-offline
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # As credenciais nunca entram no repositório nem nos logs.
      # O único segredo no GitHub é o token do Vault; o resto vem do Vault.
      - name: Ler credenciais do Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/sdwan/manager url      | TF_VAR_vmanage_url ;
            secret/data/sdwan/manager username | TF_VAR_vmanage_username ;
            secret/data/sdwan/manager password | TF_VAR_vmanage_password

      - name: Init
        run: terraform init -input=false
        working-directory: 04-terraform

      - name: Plan
        run: terraform plan -input=false -var "aluno=00"
        working-directory: 04-terraform

  aplicar-e-verificar:
    name: Aplicar com verificação e rollback
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: fabric-lab # exige approval antes de tocar no fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3

      - name: Instalar dependências
        run: pip install -e .

      - name: Ler credenciais do Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/sdwan/manager url      | VMANAGE_URL ;
            secret/data/sdwan/manager username | VMANAGE_USERNAME ;
            secret/data/sdwan/manager password | VMANAGE_PASSWORD

      - name: Espelhar credenciais para o Terraform
        run: |
          echo "TF_VAR_vmanage_url=$VMANAGE_URL"           >> "$GITHUB_ENV"
          echo "TF_VAR_vmanage_username=$VMANAGE_USERNAME" >> "$GITHUB_ENV"
          echo "TF_VAR_vmanage_password=$VMANAGE_PASSWORD" >> "$GITHUB_ENV"

      - name: Init
        run: terraform init -input=false
        working-directory: 04-terraform

      # O pipeline sai com 1 quando detecta regressão — e já fez o rollback.
      - name: Precheck → apply → postcheck → rollback
        run: python 05-pipeline/solution/pipeline.py

      # Os retratos ficam anexados ao run: é a evidência de que a mudança
      # foi verificada, e o material de análise quando ela não foi.
      - name: Guardar os retratos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retratos-do-fabric
          path: 05-pipeline/snapshots/
